<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #f0f4ff 0%, #e8eef5 100%);
      color: #1a1a2e;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.1);
    }

    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #475569;
      background: #f1f5f9;
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      line-height: 1;
    }

    .icon.success {
      background: #dcfce7;
      color: #16a34a;
    }

    .icon.info {
      background: #dbeafe;
      color: #2563eb;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #64748b;
    }

    .footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <main class="card">
    <span class="badge">Todo API</span>
    <div class="icon {{ 'info' if already_verified else 'success' }}">
      {{ 'ℹ' if already_verified else '✓' }}
    </div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <p class="footer">Можете закрити цю вкладку</p>
  </main>
</body>

</html>
