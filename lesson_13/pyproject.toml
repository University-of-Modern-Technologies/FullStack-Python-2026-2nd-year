[project]
name = "lesson-13"
version = "0.1.0"
description = "Todo API: env, rate limit, CORS, Redis cache, RBAC"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "cloudinary>=1.44.2",
    "fastapi-mail>=1.6.4",
    "fastapi[standard]>=0.136.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "redis>=5.2.1",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "furo>=2025.9.25",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "sphinx>=9.1.0",
]

[tool.pytest.ini_options]
pythonpath = "."
filterwarnings = ["ignore"]
